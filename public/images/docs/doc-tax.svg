<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281e0e"/>
      <stop offset="100%" stop-color="#130d05"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="500" height="500" rx="24" fill="url(#cardBg)"/>
  <rect x="2" y="2" width="496" height="496" rx="22" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Watermark seal -->
  <circle cx="250" cy="270" r="140" fill="none" stroke="#f59e0b" stroke-opacity="0.06" stroke-width="6" stroke-dasharray="8 6"/>
  <circle cx="250" cy="270" r="115" fill="none" stroke="#f59e0b" stroke-opacity="0.04" stroke-width="3"/>

  <!-- Top bar -->
  <rect x="36" y="36" width="428" height="60" rx="12" fill="rgba(255,255,255,0.05)"/>
  <text x="56" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" letter-spacing="2">FINANCE</text>
  <text x="444" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="end">FIN-TAX-2026</text>

  <!-- Document Icon & Seal -->
  <g transform="translate(48, 124)">
    <rect width="64" height="64" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="32" y="42" font-size="32" text-anchor="middle">📊</text>
  </g>

  <!-- Document Title -->
  <text x="128" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Annual Tax Assessment</text>
  <text x="128" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Encrypted with AES-256 GCM</text>

  <!-- Content Lines -->
  <g transform="translate(48, 224)">
    <rect width="404" height="150" rx="14" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)"/>
    
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="600">Filing Year:</text>
      <text x="140" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" font-weight="500">Assessment Year 2026-27</text>
    
      <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="600">Status:</text>
      <text x="140" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" font-weight="500">Filed & Cleared</text>
    
      <text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="600">Receipt No:</text>
      <text x="140" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" font-weight="500">ITR-7739104-V</text>
    
      <text x="24" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="600">Vault Hash:</text>
      <text x="140" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" font-weight="500">11a8...3b92</text>
    
  </g>

  <!-- Bottom Verification badge -->
  <g transform="translate(48, 404)">
    <rect width="404" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="#f59e0b" stroke-opacity="0.25"/>
    <circle cx="30" cy="26" r="10" fill="#f59e0b" fill-opacity="0.2"/>
    <path d="M26 26 L29 29 L35 22" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Verified Document</text>
    <text x="384" y="31" font-family="'Courier New', monospace" font-size="11" fill="#f59e0b" text-anchor="end">SHA-256 ✓</text>
  </g>
</svg>